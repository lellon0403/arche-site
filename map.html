<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1117">
<title>아르케 세계 지도 — ARCHE</title>
<meta name="description" content="아르케 대륙과 원소 마을을 살펴보는 가벼운 대화형 세계 지도.">
<link rel="icon" href="favicon.ico?v=1" sizes="any">
<style>
:root{--pit:#0e1117;--pit-2:#12161c;--stone:#1a2029;--seam:#2b3441;--lamp:#e8913c;--chalk:#eae3d6;--chalk-2:#c4bcac;--dust:#8b8577;--bar-h:58px}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--pit);color:var(--chalk)}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}button,a{font:inherit;color:inherit}.mapbar{height:var(--bar-h);display:flex;align-items:center;gap:18px;padding:0 22px;border-bottom:1px solid var(--seam);background:rgba(14,17,23,.98)}
.back{padding:7px 10px;border:1px solid var(--seam);border-radius:4px;text-decoration:none;font-size:13px;white-space:nowrap}.back:hover,.back:focus-visible{border-color:var(--lamp);outline:0}
.title{min-width:0;margin-right:auto;font-size:18px;font-weight:750;white-space:nowrap}.title small{margin-left:9px;color:var(--lamp);font:600 9px ui-monospace,monospace;letter-spacing:.2em}.hint{color:var(--dust);font-size:11px;white-space:nowrap}
.stage{height:calc(100% - var(--bar-h));padding:14px;background:radial-gradient(circle at 50% 45%,#171c23 0,#0e1117 68%)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 294px;gap:14px;width:min(1900px,100%);height:100%;margin:auto}.map-panel,.side{min-width:0;border:1px solid var(--seam);background:var(--pit-2)}
.map-panel{display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}.map-tools{min-height:54px;display:flex;align-items:center;gap:14px;padding:9px 12px;border-bottom:1px solid #3d3429;background:#151719}
.scale{margin-right:auto;min-width:0}.scale span{display:block;color:var(--dust);font:600 8px ui-monospace,monospace;letter-spacing:.16em}.scale b{display:block;margin-top:3px;overflow:hidden;color:var(--chalk-2);font-size:12px;font-weight:550;text-overflow:ellipsis;white-space:nowrap}.coords{color:#a9a194;font:500 10px ui-monospace,monospace;white-space:nowrap}
.zoom-controls{display:flex;align-items:center;gap:5px}.zoom-controls button{width:31px;height:31px;padding:0;border:1px solid #3b414a;background:#1a1e24;color:var(--chalk);font:600 13px ui-monospace,monospace;cursor:pointer}.zoom-controls button:hover,.zoom-controls button:focus-visible,.zoom-controls button.active{border-color:var(--lamp);color:#ffc17c;outline:0}.zoom-controls button:disabled{opacity:.35;cursor:default}.zoom-controls .reset{width:auto;padding:0 9px;font-size:10px}.zoom-steps{display:flex;gap:3px}.zoom-steps button{width:25px;height:25px;font-size:9px}
.atlas-viewport{position:relative;min-height:0;overflow:hidden;contain:strict;touch-action:none;cursor:grab;background:#080a0d;user-select:none}.atlas-viewport.dragging{cursor:grabbing}.tile-layer,.marker-layer,.world-border{position:absolute;inset:0;pointer-events:none}.tile{position:absolute;display:block;max-width:none;transform-origin:0 0;pointer-events:none;-webkit-user-drag:none}.world-border{inset:auto;border:1px solid rgba(232,145,60,.72);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.marker-layer{z-index:3}.marker{position:absolute;width:16px;height:16px;padding:0;transform:translate(-50%,-50%);border:2px solid #111;border-radius:50%;background:var(--marker);box-shadow:0 0 0 2px var(--marker),0 2px 12px #000;cursor:pointer;pointer-events:auto}.marker::after{content:attr(data-label);position:absolute;left:50%;top:20px;transform:translateX(-50%);width:max-content;max-width:160px;padding:3px 6px;border:1px solid #3c3831;background:rgba(14,17,23,.94);color:var(--chalk);font-size:10px;line-height:1.3;white-space:nowrap;pointer-events:none}.marker:hover,.marker:focus-visible,.marker.selected{z-index:5;outline:2px solid #fff;outline-offset:3px}
.loading{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);padding:9px 12px;border:1px solid #493822;background:rgba(14,17,23,.9);color:#ffc17c;font:600 10px ui-monospace,monospace;letter-spacing:.08em;transition:opacity .2s}.loading.hidden{opacity:0;pointer-events:none}
.side{display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}.side-head{padding:16px;border-bottom:1px solid var(--seam)}.side-head b{display:block;font-size:18px}.side-head small{color:var(--dust);font:500 9px ui-monospace,monospace}.village-list{overflow:auto;margin:0;padding:0;list-style:none}.village-list button{display:grid;grid-template-columns:10px 1fr;gap:11px;width:100%;padding:12px 14px;border:0;border-bottom:1px solid #222933;background:transparent;text-align:left;cursor:pointer}.village-list button:hover,.village-list button:focus-visible{background:#181d24;outline:0}.swatch{width:8px;height:8px;margin-top:5px;border-radius:50%;background:var(--marker);box-shadow:0 0 7px var(--marker)}.village-list b{display:block;font-size:13px;line-height:1.4}.village-list small{display:block;margin-top:3px;color:var(--dust);font:500 9px/1.55 ui-monospace,monospace}.map-note{padding:12px 14px;border-top:1px solid var(--seam);color:#746e64;font-size:11px;line-height:1.55}
@media(max-width:980px){.layout{grid-template-columns:1fr}.side{display:none}.stage{padding:8px}.marker::after{display:none}}
@media(max-width:700px){.map-tools{align-items:flex-start;flex-wrap:wrap}.scale{width:100%}.coords{display:none}.zoom-controls{width:100%}.zoom-controls .reset{margin-left:auto}}
@media(max-width:620px){.mapbar{padding:0 10px;gap:10px}.back{font-size:0;padding:7px 9px}.back::after{content:"←";font-size:15px}.title{font-size:16px}.title small,.hint{display:none}}
@media(prefers-reduced-motion:reduce){.loading{transition:none}}
</style>
</head>
<body>
<header class="mapbar">
  <a class="back" href="index.html">← 소개로 돌아가기</a>
  <div class="title">아르케 세계 지도<small>ARCHE OVERWORLD</small></div>
  <div class="hint">드래그 이동 · 커서 기준 휠 확대 · 마을 선택</div>
</header>
<main class="stage">
  <div class="layout">
    <section class="map-panel" aria-label="아르케 대륙 지도">
      <div class="map-tools">
        <div class="scale"><span>보기 범위</span><b id="zoom-label">전체 대륙 불러오는 중</b></div>
        <div class="coords" id="center-coords">X 0 · Z 0</div>
        <div class="zoom-controls" aria-label="지도 확대 단계">
          <button id="zoom-out" type="button" aria-label="축소">−</button>
          <div class="zoom-steps"><button type="button" data-zoom="0" aria-label="1단계 전체 보기">1</button><button type="button" data-zoom="1" aria-label="2단계 권역 보기">2</button><button type="button" data-zoom="2" aria-label="3단계 마을 보기">3</button><button type="button" data-zoom="3" aria-label="4단계 상세 보기">4</button></div>
          <button id="zoom-in" type="button" aria-label="확대">+</button><button class="reset" id="zoom-reset" type="button">전체 보기</button>
        </div>
      </div>
      <div class="atlas-viewport" id="atlas-viewport" tabindex="0" aria-label="아르케 대륙 지도. 드래그로 이동하고 휠로 확대할 수 있습니다.">
        <div class="tile-layer" id="tile-layer"></div><div class="world-border" id="world-border"></div><div class="marker-layer" id="marker-layer"></div><div class="loading" id="map-loading">지형 타일 불러오는 중</div>
      </div>
    </section>
    <aside class="side">
      <div class="side-head"><b>원소 마을</b><small id="village-count">좌표 자료 불러오는 중</small></div>
      <ul class="village-list" id="village-list"></ul>
      <div class="map-note">지도는 정지 상태에서 GPU를 계속 사용하지 않습니다. 마을과 지형이 추가되면 같은 좌표계에 반영됩니다.</div>
    </aside>
  </div>
</main>
<script>
(async()=>{
  const viewport=document.getElementById('atlas-viewport'),tileLayer=document.getElementById('tile-layer'),markerLayer=document.getElementById('marker-layer'),border=document.getElementById('world-border'),loading=document.getElementById('map-loading'),list=document.getElementById('village-list'),count=document.getElementById('village-count'),zoomLabel=document.getElementById('zoom-label'),centerCoords=document.getElementById('center-coords'),zoomOut=document.getElementById('zoom-out'),zoomIn=document.getElementById('zoom-in'),stepButtons=[...document.querySelectorAll('[data-zoom]')];
  const zoomLevels=[{factor:1,label:'1단계 · 전체 8000 × 8000블록'},{factor:1.8,label:'2단계 · 권역 약 4400블록'},{factor:3.5,label:'3단계 · 마을 약 2300블록'},{factor:7,label:'4단계 · 상세 약 1100블록'}];
  const lods=[{level:3,worldSize:12500,min:-1,max:0},{level:2,worldSize:2500,min:-2,max:1},{level:1,worldSize:500,min:-9,max:8}];
  let world=null,zoomIndex=0,centerX=0,centerZ=0,dragging=false,lastX=0,lastY=0,pointerX=0,pointerY=0,lastWheel=0,renderQueued=false,firstTile=false;
  const tiles=new Map();
  function baseScale(){if(!world)return 1;return Math.min((viewport.clientWidth-48)/(world.maxX-world.minX),(viewport.clientHeight-48)/(world.maxZ-world.minZ))}
  function scale(){return baseScale()*zoomLevels[zoomIndex].factor}
  function clampCamera(){const s=scale(),halfX=viewport.clientWidth/(2*s),halfZ=viewport.clientHeight/(2*s),minX=world.minX+halfX,maxX=world.maxX-halfX,minZ=world.minZ+halfZ,maxZ=world.maxZ-halfZ;centerX=minX>maxX?(world.minX+world.maxX)/2:Math.max(minX,Math.min(maxX,centerX));centerZ=minZ>maxZ?(world.minZ+world.maxZ)/2:Math.max(minZ,Math.min(maxZ,centerZ))}
  function worldToScreen(x,z){const s=scale();return{x:viewport.clientWidth/2+(x-centerX)*s,y:viewport.clientHeight/2+(z-centerZ)*s}}
  function screenToWorld(x,y){const s=scale();return{x:centerX+(x-viewport.clientWidth/2)/s,z:centerZ+(y-viewport.clientHeight/2)/s}}
  function currentLod(){return zoomIndex===0?lods[0]:zoomIndex<3?lods[1]:lods[2]}
  function tilePath(lod,x,z){return`map-tiles/${lod}/x${x}/z${z}.webp`}
  function drawTiles(){const lod=currentLod(),s=scale(),size=lod.worldSize*s,leftWorld=centerX-viewport.clientWidth/(2*s),rightWorld=centerX+viewport.clientWidth/(2*s),topWorld=centerZ-viewport.clientHeight/(2*s),bottomWorld=centerZ+viewport.clientHeight/(2*s),minX=Math.max(lod.min,Math.floor(leftWorld/lod.worldSize)-1),maxX=Math.min(lod.max,Math.floor(rightWorld/lod.worldSize)+1),minZ=Math.max(lod.min,Math.floor(topWorld/lod.worldSize)-1),maxZ=Math.min(lod.max,Math.floor(bottomWorld/lod.worldSize)+1),needed=new Set();
    for(let x=minX;x<=maxX;x++)for(let z=minZ;z<=maxZ;z++){const key=`${lod.level}:${x}:${z}`;needed.add(key);let img=tiles.get(key);if(!img){img=new Image();img.className='tile';img.alt='';img.decoding='async';img.draggable=false;img.src=tilePath(lod.level,x,z);img.addEventListener('load',()=>{if(!firstTile){firstTile=true;loading.classList.add('hidden')}});tiles.set(key,img);tileLayer.appendChild(img)}const p=worldToScreen(x*lod.worldSize,z*lod.worldSize);img.style.width=`${size+1}px`;img.style.height=`${size+1}px`;img.style.transform=`translate3d(${p.x}px,${p.y}px,0)`}
    for(const[key,img]of tiles)if(!needed.has(key)){img.remove();tiles.delete(key)}
  }
  function drawMarkers(){for(const marker of markerLayer.children){const p=worldToScreen(Number(marker.dataset.x),Number(marker.dataset.z));marker.style.left=`${p.x}px`;marker.style.top=`${p.y}px`;marker.hidden=p.x<-40||p.y<-40||p.x>viewport.clientWidth+40||p.y>viewport.clientHeight+40}}
  function drawBorder(){const nw=worldToScreen(world.minX,world.minZ),se=worldToScreen(world.maxX,world.maxZ);border.style.left=`${nw.x}px`;border.style.top=`${nw.y}px`;border.style.width=`${se.x-nw.x}px`;border.style.height=`${se.y-nw.y}px`}
  function render(){renderQueued=false;if(!world||!viewport.clientWidth)return;clampCamera();drawTiles();drawMarkers();drawBorder();zoomLabel.textContent=zoomLevels[zoomIndex].label;centerCoords.textContent=`X ${Math.round(centerX)} · Z ${Math.round(centerZ)}`;zoomOut.disabled=zoomIndex===0;zoomIn.disabled=zoomIndex===zoomLevels.length-1;stepButtons.forEach((button,index)=>button.classList.toggle('active',index===zoomIndex))}
  function queueRender(){if(!renderQueued){renderQueued=true;requestAnimationFrame(render)}}
  function updatePointer(event){const rect=viewport.getBoundingClientRect();pointerX=event.clientX-rect.left;pointerY=event.clientY-rect.top}
  function setZoom(next,anchorX=viewport.clientWidth/2,anchorY=viewport.clientHeight/2){const before=screenToWorld(anchorX,anchorY),newIndex=Math.max(0,Math.min(zoomLevels.length-1,next));if(newIndex===zoomIndex)return;zoomIndex=newIndex;const s=scale();centerX=before.x-(anchorX-viewport.clientWidth/2)/s;centerZ=before.z-(anchorY-viewport.clientHeight/2)/s;if(zoomIndex===0){centerX=0;centerZ=0}queueRender()}
  zoomOut.addEventListener('click',()=>setZoom(zoomIndex-1,pointerX||viewport.clientWidth/2,pointerY||viewport.clientHeight/2));zoomIn.addEventListener('click',()=>setZoom(zoomIndex+1,pointerX||viewport.clientWidth/2,pointerY||viewport.clientHeight/2));document.getElementById('zoom-reset').addEventListener('click',()=>{centerX=0;centerZ=0;setZoom(0);queueRender()});stepButtons.forEach(button=>button.addEventListener('click',()=>setZoom(Number(button.dataset.zoom),pointerX||viewport.clientWidth/2,pointerY||viewport.clientHeight/2)));
  viewport.addEventListener('wheel',event=>{event.preventDefault();updatePointer(event);const now=performance.now();if(now-lastWheel<140)return;lastWheel=now;setZoom(zoomIndex+(event.deltaY>0?-1:1),pointerX,pointerY)},{passive:false});
  viewport.addEventListener('pointerdown',event=>{if(event.target.closest('.marker'))return;dragging=true;lastX=event.clientX;lastY=event.clientY;viewport.classList.add('dragging');viewport.setPointerCapture(event.pointerId)});viewport.addEventListener('pointermove',event=>{updatePointer(event);if(!dragging)return;const s=scale();centerX-=(event.clientX-lastX)/s;centerZ-=(event.clientY-lastY)/s;lastX=event.clientX;lastY=event.clientY;queueRender()});
  function stopDrag(){dragging=false;viewport.classList.remove('dragging')}viewport.addEventListener('pointerup',stopDrag);viewport.addEventListener('pointercancel',stopDrag);viewport.addEventListener('keydown',event=>{if(event.key==='+'||event.key==='=')setZoom(zoomIndex+1);else if(event.key==='-')setZoom(zoomIndex-1);else if(event.key==='0'){centerX=0;centerZ=0;setZoom(0);queueRender()}else return;event.preventDefault()});
  function preloadRegionTiles(){if(navigator.connection&&navigator.connection.saveData)return;for(let x=-2;x<=1;x++)for(let z=-2;z<=1;z++){const image=new Image();image.decoding='async';image.src=tilePath(2,x,z)}}
  try{const response=await fetch('data/world-map.json');if(!response.ok)throw new Error('map data unavailable');const data=await response.json();world=data.world;for(const village of data.villages){const marker=document.createElement('button');marker.className='marker';marker.type='button';marker.dataset.label=village.label;marker.dataset.x=village.x;marker.dataset.z=village.z;marker.style.setProperty('--marker',village.color);marker.setAttribute('aria-label',`${village.label}, X ${village.x}, Z ${village.z}`);marker.addEventListener('click',()=>{centerX=village.x;centerZ=village.z;if(zoomIndex<2)zoomIndex=2;document.querySelectorAll('.marker.selected').forEach(item=>item.classList.remove('selected'));marker.classList.add('selected');queueRender()});markerLayer.appendChild(marker);
      const item=document.createElement('li'),button=document.createElement('button');button.type='button';button.style.setProperty('--marker',village.color);button.innerHTML=`<span class="swatch"></span><div><b>${village.label}</b><small>${village.biome}<br>X ${village.x} · Z ${village.z}</small></div>`;button.addEventListener('click',()=>marker.click());item.appendChild(button);list.appendChild(item)}count.textContent=`${data.villages.length}곳 · 시드 ${world.seed}`;new ResizeObserver(queueRender).observe(viewport);queueRender();if('requestIdleCallback'in window)requestIdleCallback(preloadRegionTiles,{timeout:2500});else setTimeout(preloadRegionTiles,1200)}catch(error){loading.textContent='지도 자료를 불러오지 못했습니다';count.textContent='좌표 자료 준비 중';console.error(error)}
})();
</script>
</body>
</html>
